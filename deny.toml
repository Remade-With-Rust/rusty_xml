# cargo-deny — enforces the no-copyleft / no-C-sys promise.
# CI: cargo deny check

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
deny = [
    { crate = "libxml2-sys" },
    { crate = "libxml-sys" },
    { crate = "zstd-sys" },
    { crate = "openssl-sys" },
    { crate = "libz-sys" },
    { crate = "lzma-sys" },
    { crate = "lz4-sys" },
    { crate = "xxhash-sys" },
]

[advisories]
yanked = "deny"
# The fix needs rustc 1.87, above MSRV 1.85. ruzstd reaches only the dev graph of
# rusty_xml and the unpublished rusty_xml-bench, which decode the committed fixture archive.
ignore = [
    { id = "RUSTSEC-2026-0344", reason = "ruzstd 0.8.1 decompression bomb; fixed only in 0.9.1 (rustc 1.87). Dev and bench only, decodes committed input. Revisit at MSRV 1.87." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
