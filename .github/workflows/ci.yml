name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --exclude rusty_xml-bench
      - name: README copies are identical
        shell: bash
        run: diff -u README.md crates/rusty_xml/README.md
      - name: Doc tests (README examples)
        run: cargo test -p rusty_xml --doc
      - name: CLI
        run: cargo run -p rusty_xml-cli -- --noout corpora/title.xml

  portable:
    name: wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm32 library
        run: cargo check -p rusty_xml --target wasm32-unknown-unknown

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build fuzzer
        run: cargo build --release -p rusty_xml-bench --bin fuzz
      - name: Fuzz
        shell: bash
        # Fixed seeds: a red run reproduces locally with `fuzz 150000 <seed>`.
        run: |
          for seed in 1 2 3 4 5; do
            target/release/fuzz 150000 "$seed" || exit 1
          done

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package -p rusty_xml --allow-dirty
      # Every published crate must ship the licence texts its `license` field
      # names (and the NOTICE), as copies identical to the root files: cargo
      # cannot package files from outside a crate's directory.
      - name: Published crates ship LICENSE-MIT, LICENSE-APACHE, NOTICE.md
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 > "$RUNNER_TEMP/meta.json"
          jq -r '.packages[] | select(.publish != []) | "\(.name) \(.manifest_path)"' \
              "$RUNNER_TEMP/meta.json" \
            | while read -r p manifest; do
                dir=$(dirname "$manifest")
                list=$(cargo package --list -p "$p" --allow-dirty < /dev/null)
                for f in LICENSE-MIT LICENSE-APACHE NOTICE.md; do
                  diff -u "$f" "$dir/$f"
                  grep -qx "$f" <<<"$list" || { echo "$p does not package $f"; exit 1; }
                done
                echo "$p ships LICENSE-MIT, LICENSE-APACHE, NOTICE.md"
              done
