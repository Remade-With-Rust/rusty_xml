# cargo-deny — enforces the no-copyleft / no-C-sys promise.
# CI: cargo deny check

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
deny = [
    { crate = "libxml2-sys" },
    { crate = "libxml-sys" },
    { crate = "zstd-sys" },
    { crate = "openssl-sys" },
    { crate = "libz-sys" },
    { crate = "lzma-sys" },
    { crate = "lz4-sys" },
    { crate = "xxhash-sys" },
]

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
